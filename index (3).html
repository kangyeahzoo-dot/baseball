<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>2026 KBO 선수 기록</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{--bg:#eef2f1;--panel:#fff;--ink:#14231f;--sub:#5d6f69;--line:#d6dedb;--acc:#1f5c4a;
--t0:#c8473b;--t1:#e08a3c;--t2:#9aa5a1;--t3:#4a9a73;--t4:#1b6e4f;--off:#e3e9e7;--brand:var(--acc);--onbrand:#fff;--tl0:var(--t0);--tl1:var(--t1);--tl2:var(--t2);--tl3:var(--t3);--tl4:var(--t4);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1816;--panel:#17231f;--ink:#e6efec;--sub:#8fa39c;--line:#2a3a35;--acc:#5fc19a;--off:#243430;--t2:#7d8a86;--onbrand:#0f1816}}
:root[data-theme="dark"]{--bg:#0f1816;--panel:#17231f;--ink:#e6efec;--sub:#8fa39c;--line:#2a3a35;--acc:#5fc19a;--off:#243430;--t2:#7d8a86;--onbrand:#0f1816}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;line-height:1.5}
main{max-width:1040px;margin:0 auto;padding:28px 18px 48px}
h1{font-size:26px;margin:0 0 4px;letter-spacing:-.02em}
.lead{color:var(--sub);margin:0 0 22px;font-size:14px}
.tabs{display:inline-flex;background:var(--off);border-radius:10px;padding:4px;margin-bottom:18px}
.tabs button{border:0;background:none;color:var(--sub);font:inherit;font-weight:500;padding:8px 22px;border-radius:7px;cursor:pointer}
.tabs button[aria-selected=true]{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.grid{display:grid;grid-template-columns:320px 1fr;gap:18px;align-items:start}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px}
label.t{display:block;font-size:12px;color:var(--sub);font-weight:500}
button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:6px 0 18px}
.team{padding:8px 6px;border:1px solid var(--line);border-radius:8px;background:none;color:var(--ink);font:inherit;font-size:13px;cursor:pointer}
.team[aria-pressed=true]{background:var(--brand);border-color:var(--acc);color:var(--onbrand);font-weight:700}
.team{position:relative}.rk{position:absolute;top:3px;left:6px;font-size:10px;font-weight:700;color:var(--sub);opacity:.8}
.team[aria-pressed=true] .rk{color:inherit}
.team.logo{background:#fff;padding:8px 6px 6px}.team.logo img{display:block;width:100%;height:60px;object-fit:contain}
.team.logo[aria-pressed=true]{background:#fff;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand);color:#555}
.plist{max-height:min(480px,60vh);overflow-y:auto;border:1px solid var(--line);border-radius:8px;margin-top:6px}
.pi{display:flex;justify-content:space-between;gap:8px;width:100%;padding:9px 10px;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);font:inherit;font-size:13px;text-align:left;cursor:pointer}
.pi:last-child{border-bottom:0}.pi span{color:var(--sub);font-size:12px;white-space:nowrap}.pi:hover{background:var(--bg)}
.pi.q{background:color-mix(in srgb,var(--acc) 16%,var(--panel))}
.pi[aria-current=true]{background:var(--brand);color:var(--onbrand)}.pi[aria-current=true] span{color:inherit;opacity:.85}
.who{margin-bottom:14px}.who b{color:var(--acc);font-size:20px;letter-spacing:-.02em}.who span{color:var(--sub);margin-left:8px;font-size:14px}
.verdict{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding-bottom:18px;border-bottom:1px solid var(--line)}
.verdict .big{font-size:34px;font-weight:700;letter-spacing:-.03em}
.verdict small{display:block;color:var(--sub);font-size:13px}
.meter{display:flex;gap:4px;flex:1;min-width:180px}
.meter i{height:12px;flex:1;border-radius:3px;background:var(--off)}
.meter.s i{height:8px}
.sec{font-size:13px;font-weight:700;margin:18px 0 8px}
.basic{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:8px}
.bt{background:var(--bg);border-radius:10px;padding:8px 10px}.bt small{display:block;color:var(--sub);font-size:11px}.bt b{font-size:17px;font-variant-numeric:tabular-nums}
.row{display:grid;grid-template-columns:96px 84px 1fr 74px 24px;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.grp{border-top:3px solid color-mix(in srgb,var(--sub) 40%,var(--panel));border-bottom:3px solid color-mix(in srgb,var(--sub) 40%,var(--panel));padding:0;margin:6px 0}
.row:has(+.grp){border-bottom:0}
.row .n{font-weight:500}.row .n span{display:block;font-size:11px;color:var(--sub);font-weight:400}
.row .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.row .l{font-size:13px;font-weight:700;text-align:right}
.row .info{color:var(--sub);font-size:12px;text-align:right}
.ib{border:0;background:none;color:var(--sub);cursor:pointer;font-size:15px;line-height:1;padding:2px;border-radius:50%}
.ib:hover,.ib[aria-expanded=true]{color:var(--acc)}
@media(max-width:520px){.row{grid-template-columns:80px 70px 1fr 24px}.row .l{grid-column:1/-1;text-align:left}.ib{grid-column:4;grid-row:1}}
.legend{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sub);margin:6px 0 0}.legend[hidden]{display:none}
.qs{display:inline-block;width:14px;height:14px;border-radius:4px;background:color-mix(in srgb,var(--acc) 16%,var(--panel));border:1px solid var(--line)}
.hint{font-size:12px;color:var(--sub);margin:14px 0 0}
.empty{color:var(--sub);padding:40px 0;text-align:center}.empty.s{padding:22px 10px;font-size:13px}
.pop{position:fixed;z-index:50;width:min(320px,calc(100vw - 16px));background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:0 8px 28px rgba(0,0,0,.22);font-size:13px;line-height:1.55}
.pop[hidden]{display:none}
.pop h3{margin:0 0 6px;font-size:15px}.pop h3 span{color:var(--sub);font-weight:400;font-size:12px;margin-left:6px}
.pop .f{background:var(--bg);border-radius:8px;padding:7px 9px;font-size:12px;margin:8px 0}
.pop ul{list-style:none;margin:6px 0 0;padding:0}.pop li{display:flex;justify-content:space-between;gap:8px;padding:2px 0;font-size:12px;color:var(--sub)}.pop li.on{color:var(--ink);font-weight:700}
.pop .note{color:var(--sub);font-size:12px;margin-top:8px}
.teams{grid-template-columns:repeat(5,1fr);gap:10px}
.team.logo{aspect-ratio:1;border-radius:50%;padding:0;overflow:visible;background:#fff;border:1px solid var(--line);transition:transform .12s}
.team.logo img{width:100%;height:100%;object-fit:contain;border-radius:50%;display:block}
.team.logo:hover{transform:scale(1.07)}
.team.logo[aria-pressed=true]{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand)}
</style>
</head>
<body>
<main>
<h1>2026 KBO 선수 기록</h1>
<p class="lead">팀과 선수를 선택하면 기본 기록과 심화 기록을 계산하고, 5단계로 평가합니다.</p>
<div class="tabs" role="tablist">
<button role="tab" aria-selected="true" id="tab-h">타자</button>
<button role="tab" aria-selected="false" id="tab-p">투수</button>
</div>
<div class="grid">
<section class="panel">
<label class="t" id="teamlab">소속 팀</label>
<div class="teams" id="teams" role="group" aria-label="소속 팀"></div>
<label class="t">선수 선택 (가나다순)</label>
<div class="legend" id="qleg"><i class="qs"></i>규정타석(446.4타석) 충족</div>
<div class="plist" id="plist"></div>
</section>
<section class="panel" id="out" aria-live="polite"></section>
</div>
</main>
<div class="pop" id="pop" role="dialog" aria-label="지표 설명" hidden></div>
<script>
const LV=['매우 못함','못함','보통','잘함','매우 잘함'];
const COL=['--t0','--t1','--t2','--t3','--t4'],COLL=['--tl0','--tl1','--tl2','--tl3','--tl4'];
// cut: 오름차순 경계 4개, dir: 1=높을수록 좋음, -1=낮을수록 좋음
const grade=(v,cut,dir)=>{if(dir>0){let s=0;cut.forEach(c=>{if(v>=c)s++});return s}let s=4;cut.forEach(c=>{if(v>=c)s--});return s};
const f3=v=>v.toFixed(3).replace(/^0\./,'.'),f2=v=>v.toFixed(2),pc=v=>(v*100).toFixed(1)+'%';
const FIPC=3.1;
// 간이 WAR 상수: wOBA 스케일, 승당 득점, 대체수준(타자: 타석당 득점 / 투수: 9이닝당 실점)
const WSC=1.2,RPW=10,REPL_PA=20/600,REPL_P=.8,warf=v=>v.toFixed(1);
const LG={w:.32,fip:0};
const GROUPS_H=[['OPS','OBP','SLG'],['BB%','K%']]; // 타자 심화 기록에서 묶어 보여줄 지표
const HIDE_P=new Set(['FIP','K/BB']); // 투수 화면에서 숨길 지표 (종합 평가에는 계속 반영)
const HIDE_H=new Set(['ISO','wOBA','BABIP']); // 타자 화면에서 숨길 지표 (ISO·wOBA는 종합 평가에는 계속 반영)
const B={h:[['ab','타수'],['h','안타'],['d','2루타'],['t','3루타'],['hr','홈런'],['bb','볼넷'],['hbp','사구'],['sf','희생플라이'],['so','삼진']],
 p:[['ip','이닝'],['er','자책점'],['h','피안타'],['bb','볼넷'],['hbp','사구'],['so','탈삼진'],['hr','피홈런']]};
const INFO={
OPS:['출루율 + 장타율','출루 능력과 장타 능력을 한 숫자로 합친 지표입니다. 타자의 전반적인 공격 생산력을 빠르게 볼 때 가장 흔히 씁니다.','OPS = OBP + SLG','보통 .800 이상이면 좋은 타자, .900 이상이면 리그 최상위권으로 봅니다.'],
wOBA:['가중 출루율','출루 방법마다 득점에 기여하는 정도가 다르다는 점을 반영한 지표입니다. 볼넷보다 안타, 단타보다 장타에 더 높은 가중치를 줍니다.','wOBA = (0.69×볼넷 + 0.72×사구 + 0.89×1루타 + 1.27×2루타 + 1.62×3루타 + 2.10×홈런) ÷ 타석','가중치는 MLB 평균 근사값입니다. 타석은 타수+볼넷+사구+희생플라이로 계산합니다.'],
ISO:['순수 장타력','안타 중 장타가 얼마나 많은지를 보여줍니다. 타율이 같아도 ISO가 높으면 한 방을 가진 타자입니다.','ISO = SLG − AVG','.200 이상이면 장타력이 뛰어난 편입니다.'],
'BB%':['볼넷 비율','타석 중 볼넷으로 출루한 비율입니다. 선구안과 투수가 승부를 피하는 정도를 함께 보여줍니다.','BB% = 볼넷 ÷ 타석','높을수록 좋습니다.'],
'K%':['삼진 비율','타석 중 삼진으로 물러난 비율입니다. 낮을수록 컨택 능력이 좋다고 봅니다.','K% = 삼진 ÷ 타석','낮을수록 좋습니다. 그래서 값이 낮을수록 높은 단계로 평가합니다.'],
AVG:['타율','안타를 타수로 나눈 가장 기본적인 타격 지표입니다. 볼넷과 장타는 반영하지 않습니다.','AVG = 안타 ÷ 타수',''],
OBP:['출루율','타석에서 아웃되지 않고 출루한 비율입니다.','OBP = (안타 + 볼넷 + 사구) ÷ (타수 + 볼넷 + 사구 + 희생플라이)',''],
SLG:['장타율','타수당 평균 루타 수로, 장타에 가중치를 둔 장타력 지표입니다.','SLG = 총루타 ÷ 타수\n총루타 = 1루타 + 2×2루타 + 3×3루타 + 4×홈런',''],
BABIP:['인플레이 타구 타율','홈런을 뺀 인플레이 타구가 안타가 된 비율입니다. 수비와 운의 영향이 커서 평균(약 .300)에서 크게 벗어나면 성적이 달라질 수 있다고 봅니다.','BABIP = (안타 − 홈런) ÷ (타수 − 삼진 − 홈런 + 희생플라이)','평가 단계 없이 참고용으로만 표시합니다.'],
WAR:['WAR (타자·입력 기록)','대체 선수 대비 시즌 동안 몇 승을 더했는지 나타내는 종합 지표입니다. 외부 기록에서 가져온 값을 그대로 표시합니다.','WAR = 타격 + 주루 + 수비 + 포지션 + 대체 수준 보정\n(산출 방식은 기록 제공처의 정의를 따름)','기록 파일에 값이 입력된 타자는 이 값을, 값이 없는 선수는 간이 WAR(oWAR) 추정치를 표시합니다. 누적 값이라 출전이 적으면 낮게 나옵니다. 타자 종합 평가에 25% 반영됩니다.'],
oWAR:['간이 WAR (타자·추정)','같은 타석 수를 소화한 대체 선수 대비 몇 승을 더 만들었는지 공격 기록만으로 추정한 값입니다. 수비·포지션·주루·구장 보정은 반영하지 않습니다.','타격 득점 = (wOBA − 리그 평균 wOBA) ÷ 1.2 × 타석\n대체 보정 = 타석 × 20 ÷ 600\noWAR = (타격 득점 + 대체 보정) ÷ 10','리그 평균 wOBA는 이 앱에 들어 있는 전체 타자 기록으로 계산합니다. 누적 값이라 출전이 적으면 낮게 나옵니다. 공식 WAR와는 다르며 타자 종합 평가에 25% 반영됩니다.'],
WAR_p:['WAR (투수·입력 기록)','대체 선수 대비 시즌 동안 몇 승을 더했는지 나타내는 종합 지표입니다. 외부 기록에서 가져온 값을 그대로 표시합니다.','WAR = 실점 억제 + 이닝 보정 + 대체 수준 보정\n(산출 방식은 기록 제공처의 정의를 따름)','기록 파일에 값이 입력된 투수는 이 값을, 값이 없는 선수는 간이 WAR(pWAR) 추정치를 표시합니다. 누적 값이라 이닝이 적으면 낮게 나옵니다. 투수 종합 평가에 20% 반영됩니다.'],
pWAR:['간이 WAR (투수·추정)','FIP 기준으로 리그 평균 투수보다 얼마나 실점을 막았는지, 대체 선수 대비 몇 승을 더했는지 추정한 값입니다. 수비·구장·불펜 레버리지는 반영하지 않습니다.','방어 득점 = (리그 평균 FIP − FIP) × 이닝 ÷ 9\n대체 보정 = 0.8 × 이닝 ÷ 9\npWAR = (방어 득점 + 대체 보정) ÷ 10','리그 평균 FIP는 이 앱의 전체 투수 기록을 이닝으로 가중해 계산합니다. 누적 값이라 이닝이 적으면 낮게 나옵니다. 공식 WAR와는 다르며 투수 종합 평가에 20% 반영됩니다.'],
ERA:['평균자책점','9이닝 동안 내주는 평균 자책점입니다. 투수의 실점 억제력을 보는 가장 기본적인 지표입니다.','ERA = 자책점 × 9 ÷ 이닝','낮을수록 좋습니다. 이닝이 적으면 값이 크게 흔들립니다.'],
FIP:['수비 무관 평균자책점','투수가 직접 통제하는 결과(삼진, 볼넷, 사구, 피홈런)만으로 계산한 평균자책점입니다. 수비와 운의 영향을 줄여 투수 본연의 실력을 봅니다.','FIP = (13×피홈런 + 3×(볼넷+사구) − 2×탈삼진) ÷ 이닝 + 상수','상수는 리그 평균에 맞추는 값으로, 이 앱은 3.10을 사용합니다. 낮을수록 좋습니다.'],
WHIP:['이닝당 출루 허용','이닝당 허용한 주자(안타+볼넷) 수입니다. 출루를 막는 능력을 보여줍니다.','WHIP = (피안타 + 볼넷) ÷ 이닝','낮을수록 좋습니다. 1.00 이하면 매우 뛰어난 편입니다.'],
'K/9':['9이닝당 탈삼진','9이닝 기준으로 삼진을 몇 개 잡는지 보여줍니다.','K/9 = 탈삼진 × 9 ÷ 이닝','높을수록 좋습니다.'],
'BB/9':['9이닝당 볼넷','9이닝 기준으로 볼넷을 몇 개 내주는지 보여주는 제구력 지표입니다.','BB/9 = 볼넷 × 9 ÷ 이닝','낮을수록 좋습니다.'],
'HR/9':['9이닝당 피홈런','9이닝 기준으로 홈런을 몇 개 맞는지 보여줍니다.','HR/9 = 피홈런 × 9 ÷ 이닝','낮을수록 좋습니다.'],
'K/BB':['삼진 대 볼넷','볼넷 대비 삼진 비율로, 삼진 능력과 제구력을 함께 봅니다.','K/BB = 탈삼진 ÷ 볼넷','볼넷이 0이면 1로 계산합니다. 높을수록 좋습니다.']};
const MODES={
h:{calc(x){const pa=x.ab+x.bb+x.hbp+x.sf,b1=x.h-x.d-x.t-x.hr;
 if(x.h>x.ab||b1<0||pa<=0)throw '기록에 오류가 있어 계산할 수 없습니다.';
 const tb=b1+2*x.d+3*x.t+4*x.hr,avg=x.h/x.ab,obp=(x.h+x.bb+x.hbp)/pa,slg=tb/x.ab;
 const woba=(.69*x.bb+.72*x.hbp+.89*b1+1.27*x.d+1.62*x.t+2.1*x.hr)/pa;
 const babip=(x.h-x.hr)/Math.max(1,x.ab-x.so-x.hr+x.sf);
 const war=((woba-LG.w)/WSC*pa+pa*REPL_PA)/RPW;
 return[
 x.war!=null?['WAR','시즌 WAR · 입력 기록',x.war,warf,[0,1,2.5,4.5],1,.25]:['oWAR','간이 WAR · 추정',war,warf,[0,1,2.5,4.5],1,.25],
 ['AVG','타율',avg,f3,[.22,.25,.28,.31],1,.05],
 ['OPS','출루율+장타율',obp+slg,f3,[.6,.7,.8,.9],1,0],
 ['OBP','출루율',obp,f3,[.29,.32,.35,.39],1,.075],
 ['SLG','장타율',slg,f3,[.35,.4,.45,.52],1,.075],
 ['ISO','순수 장타력',slg-avg,f3,[.1,.14,.18,.23],1,.1],
 ['BB%','볼넷 비율',x.bb/pa,pc,[.05,.07,.1,.13],1,.075],
 ['K%','삼진 비율',x.so/pa,pc,[.15,.19,.23,.27],-1,.075],
 ['wOBA','가중 출루율',woba,f3,[.29,.32,.35,.39],1,.3],
 ['BABIP','인플레이 타구 타율',babip,f3,null,0,0]]}},
p:{calc(x){const w=Math.floor(x.ip),fr=Math.round((x.ip-w)*10);
 const ip=w+fr/3;if(!(ip>0))throw '이닝이 0이라 계산할 수 없습니다.';
 const fip=(13*x.hr+3*(x.bb+x.hbp)-2*x.so)/ip+FIPC;
 const war=((LG.fip-(fip-FIPC))*ip/9+REPL_P*ip/9)/RPW;
 return[
 x.war!=null?['WAR','시즌 WAR · 입력 기록',x.war,warf,[0,.8,2.2,4],1,.2]:['pWAR','간이 WAR · 추정',war,warf,[0,.8,2.2,4],1,.2],
 ['ERA','평균자책점',9*x.er/ip,f2,[3,3.6,4.3,5],-1,.25],
 ['WHIP','이닝당 출루 허용',(x.h+x.bb)/ip,f2,[1.08,1.2,1.35,1.5],-1,.125],
 ['K/9','9이닝당 탈삼진',9*x.so/ip,f2,[6,7.5,9,10.5],1,.075],
 ['BB/9','9이닝당 볼넷',9*x.bb/ip,f2,[2,2.7,3.3,4],-1,.075],
 ['HR/9','9이닝당 피홈런',9*x.hr/ip,f2,[.65,.9,1.15,1.4],-1,.05],
 ['FIP','수비 무관 평균자책점',fip,f2,[3,3.6,4.3,5],-1,.125],
 ['K/BB','삼진 대 볼넷',x.so/Math.max(x.bb,1),f2,[1.8,2.5,3.3,4.5],1,.1]]}}};

 Object.values(DB).flat().forEach(({v:x})=>{const b1=x.h-x.d-x.t-x.hr,p=x.ab+x.bb+x.hbp+x.sf;if(p>0&&b1>=0){n+=.69*x.bb+.72*x.hbp+.89*b1+1.27*x.d+1.62*x.t+2.1*x.hr;pa+=p}});
 Object.values(DBP).flat().forEach(({v:x})=>{const i=ipv(parseFloat(x.ip));if(i>0){r+=13*x.hr+3*(x.bb+x.hbp)-2*x.so;ip+=i}});
 if(pa)LG.w=n/pa;if(ip)LG.fip=r/ip})();
// 규정타석(144경기×3.1=446.4). 타석 = 타수+볼넷+사구+희생플라이+희생번트. 희생번트는 경계선 선수만 반영
const SAC={'LG 트윈스|오지환':8,'NC 다이노스|이우성':1,'한화 이글스|김태연':15,'한화 이글스|심우준':10,'키움 히어로즈|서건창':7};
const QPA=446.4;
const isQ=p=>p.v.ab+p.v.bb+p.v.hbp+p.v.sf+(SAC[team+'|'+p.name]||0)>=QPA;
function renderPlayers(){$('qleg').hidden=mode!=='h';
 if(!team){$('plist').innerHTML='<div class="empty s">소속 팀을 선택하면 선수 목록이 나타납니다.</div>';return}
 const L=(mode==='h'?DB:DBP)[team];
 if(!L){$('plist').innerHTML='<div class="empty s">이 팀의 기록이 아직 없습니다.</div>';return}
 $('plist').innerHTML=L.map((p,i)=>`<button type="button" class="pi${mode==='h'&&isQ(p)?' q':''}" data-i="${i}" aria-current="${p===sel}">${p.name}<span>${mode==='h'?`${p.v.ab}타수 · 타율 ${f3(p.v.h/p.v.ab)}`:`${p.v.ip}이닝 · ERA ${f2(9*p.v.er/ipv(parseFloat(p.v.ip)))}`}</span></button>`).join('')}
$('plist').onclick=e=>{const b=e.target.closest('.pi');if(!b)return;sel=(mode==='h'?DB:DBP)[team][+b.dataset.i];closePop();show();renderPlayers()};
reset();
</script>
</body>
</html>
